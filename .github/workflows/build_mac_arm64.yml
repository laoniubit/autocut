name: Build Mac arm64 (Apple Silicon M-Chip)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
          - universal2
  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build-mac-arm64:
    # macos-14 = Apple M1 (arm64) — GitHub Actions 免费 runner
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # 2. 设置 Python (arm64 原生)
      - name: Set up Python 3.11 (arm64)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          architecture: 'arm64'

      # 3. 安装 Python 依赖
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_mac.txt

      # 4. 下载静态版 FFmpeg (确保分发的 App 无外部 Homebrew 动态库依赖)
      - name: Download Static FFmpeg (arm64)
        run: |
          mkdir -p _internal
          curl -L -o _internal/ffmpeg https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-1/ffmpeg-osx-arm64
          chmod +x _internal/ffmpeg
          echo "FFmpeg version: $(_internal/ffmpeg -version | head -1)"
          echo "FFmpeg arch: $(lipo -info _internal/ffmpeg)"

      # 5. 编译 whisper.cpp (Metal 加速, arm64)
      - name: Build whisper.cpp with Metal
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper_cpp
          cd /tmp/whisper_cpp
          mkdir build && cd build
          cmake .. \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_METAL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu)
          cp bin/whisper-cli "$GITHUB_WORKSPACE/_internal/whisper-cli"
          chmod +x "$GITHUB_WORKSPACE/_internal/whisper-cli"
          echo "whisper-cli arch: $(lipo -info $GITHUB_WORKSPACE/_internal/whisper-cli)"

      # 6. 下载 Whisper 模型 (tiny 用于测试/打包)
      - name: Download Whisper ggml-tiny model
        run: |
          mkdir -p models/whisper-cpp
          curl -L -o models/whisper-cpp/ggml-tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          ls -lh models/whisper-cpp/

      # 7. PyInstaller 编译打包
      - name: Build with PyInstaller (arm64)
        run: |
          python _build_mac.py --arch arm64

      # 8. 查看编译产物
      - name: List Build Output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          DIST_DIR=$(ls dist/ | head -1)
          echo "=== $DIST_DIR/ ==="
          ls -la "dist/$DIST_DIR/"
          echo "=== Binary arch check ==="
          lipo -info "dist/$DIST_DIR/ffmpeg" 2>/dev/null || true
          lipo -info "dist/$DIST_DIR/whisper-cli" 2>/dev/null || true

      # 9. 功能测试：ASR 转录
      - name: Functional Test - ASR Transcription
        run: |
          echo "====== [TEST 1] ASR 转录功能测试 ======"

          # 生成一段 3 秒静音测试音频
          _internal/ffmpeg -y -f lavfi -i sine=frequency=440:duration=3 /tmp/test_asr.wav
          echo "✅ ffmpeg 生成测试音频成功"

          # 调用 whisper-cli 对音频做推理
          _internal/whisper-cli \
            -m models/whisper-cpp/ggml-tiny.bin \
            -f /tmp/test_asr.wav \
            --output-txt \
            -of /tmp/test_asr_output
          echo "✅ whisper-cli 推理完成"

          # 输出转录结果
          echo "--- 转录结果 ---"
          cat /tmp/test_asr_output.txt || echo "(无文字内容，静音正常)"
          echo "====== ASR 测试通过 ✅ ======"

      # 10. 功能测试：服务器 API
      - name: Functional Test - Server API
        run: |
          echo "====== [TEST 2] 服务器 API 功能测试 ======"

          # 确保 _internal 目录存在并含有必要的 symlink（开发模式下）
          ls -la _internal/
          echo "ffmpeg 路径: $(ls -la _internal/ffmpeg 2>/dev/null || echo '未找到')"
          echo "templates 路径: $(ls -la _internal/templates 2>/dev/null || echo '未找到')"

          # 后台启动 Flask 服务器，并把 stdout/stderr 全部写入日志文件（使用 python -u 强制不缓冲）
          python -u acut_server.py > /tmp/server_test.log 2>&1 &
          SERVER_PID=$!
          echo "服务器 PID: $SERVER_PID"

          # 等待服务器就绪 (最多 30 秒)
          echo "等待服务器启动..."
          SERVER_OK=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5010/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ 服务器在 ${i}s 内就绪"
              SERVER_OK=1
              break
            fi
            echo "  [${i}s] 等待中... HTTP=$HTTP_CODE"
            sleep 1
          done

          # 如果服务器未就绪，打印日志并退出
          if [ "$SERVER_OK" = "0" ]; then
            echo "❌ 服务器启动失败，打印日志："
            echo "===== server log ====="
            cat /tmp/server_test.log || echo "(无日志)"
            echo "===== startup error ====="
            cat _internal_/STARTUP_ERROR.TXT 2>/dev/null || echo "(无 STARTUP_ERROR.TXT)"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # 测试主页返回 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5010/)
          echo "主页 HTTP 状态: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ 主页响应正常" || (echo "❌ 主页响应异常: $STATUS" && kill $SERVER_PID && exit 1)

          # 测试 /api/files 接口（返回 JSON）
          echo "--- /api/files 接口 ---"
          curl -s http://127.0.0.1:5010/api/files | python3 -m json.tool | head -20
          echo "✅ /api/files 接口正常"

          # 测试 /api/config 接口
          echo "--- /api/config 接口 ---"
          curl -s http://127.0.0.1:5010/api/config | python3 -m json.tool | head -20
          echo "✅ /api/config 接口正常"

          # 测试 /api/config_hard 接口（硬件信息）
          echo "--- /api/config_hard 接口（硬件探测）---"
          curl -s http://127.0.0.1:5010/api/config_hard | python3 -m json.tool
          echo "✅ /api/config_hard 接口正常"

          # 测试 /api/models 接口
          echo "--- /api/models 接口 ---"
          curl -s http://127.0.0.1:5010/api/models | python3 -m json.tool | head -20
          echo "✅ /api/models 接口正常"

          # 关闭服务器
          kill $SERVER_PID 2>/dev/null || true
          echo "====== Server API 测试全部通过 ✅ ======"

      # 11. 压缩发布包
      - name: Package Release Archive
        run: |
          DIST_DIR=$(ls dist/ | head -1)
          cd dist
          zip -r "../${DIST_DIR}.zip" "$DIST_DIR/"
          echo "Release archive: ${DIST_DIR}.zip"
          ls -lh ../*.zip

      # 12. 上传构建产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: AutoCut-Mac-arm64-${{ github.run_number }}
          path: "*.zip"
          retention-days: 30

      # 13. 如果是 tag 发布，自动创建 GitHub Release
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: "*.zip"
          name: "AutoCut Matrix AI ${{ github.ref_name }} (Mac arm64)"
          body: |
            ## AutoCut Matrix AI - Mac Apple Silicon 版本

            ### 系统要求
            - macOS 12+ (Monterey 或更新)
            - Apple Silicon (M1 / M2 / M3 / M4 芯片)

            ### 安装步骤
            1. 解压 zip 压缩包
            2. 将 Whisper 模型放入 `models/whisper-cpp/` 目录
               - 推荐: `ggml-small.bin` (487 MB)
               - 下载: https://huggingface.co/ggerganov/whisper.cpp
            3. 运行 `./AutoCut_Mac_*` 可执行文件
            4. 浏览器访问 `http://127.0.0.1:5010`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
