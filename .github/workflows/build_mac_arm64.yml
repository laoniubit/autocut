name: Build Mac arm64 & x86_64 (M-Chip & Intel)

on:
  # 手动触发
  workflow_dispatch:
  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build Mac (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-14
            python-arch: arm64
            ffmpeg-url: https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-1/ffmpeg-osx-arm64
            ggml-metal: 'ON'
          - arch: x86_64
            os: macos-13
            python-arch: x64
            ffmpeg-url: https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-1/ffmpeg-osx-x64
            ggml-metal: 'OFF'

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Python
      - name: Set up Python 3.11 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: '${{ matrix.python-arch }}'

      # 3. 安装 Python 依赖
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_mac.txt

      # 4. 下载静态版 FFmpeg (确保分发的 App 无外部 Homebrew 动态库依赖)
      - name: Download Static FFmpeg (${{ matrix.arch }})
        run: |
          mkdir -p _internal
          curl -L -o _internal/ffmpeg ${{ matrix.ffmpeg-url }}
          chmod +x _internal/ffmpeg
          echo "FFmpeg version: $(_internal/ffmpeg -version | head -1)"
          echo "FFmpeg arch: $(lipo -info _internal/ffmpeg)"

      # 5. 编译 whisper.cpp
      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper_cpp
          cd /tmp/whisper_cpp
          mkdir build && cd build
          cmake .. \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_METAL=${{ matrix.ggml-metal }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu)
          cp bin/whisper-cli "$GITHUB_WORKSPACE/_internal/whisper-cli"
          chmod +x "$GITHUB_WORKSPACE/_internal/whisper-cli"
          echo "whisper-cli arch: $(lipo -info $GITHUB_WORKSPACE/_internal/whisper-cli)"

      # 6. 下载 Whisper 模型 (tiny 用于测试/打包)
      - name: Download Whisper ggml-tiny model
        run: |
          mkdir -p models/whisper-cpp
          curl -L -o models/whisper-cpp/ggml-tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          ls -lh models/whisper-cpp/

      # 7. PyInstaller 编译打包
      - name: Build with PyInstaller (${{ matrix.arch }})
        run: |
          python _build_mac.py --arch ${{ matrix.arch }}

      # 8. 查看编译产物
      - name: List Build Output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          DIST_DIR=$(ls dist/ | head -1)
          echo "=== $DIST_DIR/ ==="
          ls -la "dist/$DIST_DIR/"
          echo "=== Binary arch check ==="
          lipo -info "dist/$DIST_DIR/ffmpeg" 2>/dev/null || true
          lipo -info "dist/$DIST_DIR/whisper-cli" 2>/dev/null || true

      # 9. 压缩发布包
      - name: Package Release Archive
        run: |
          DIST_DIR=$(ls dist/ | head -1)
          cd dist
          zip -r "../${DIST_DIR}.zip" "$DIST_DIR/"
          echo "Release archive: ${DIST_DIR}.zip"
          ls -lh ../*.zip

      # 10. 上传构建产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCut-Mac-${{ matrix.arch }}-${{ github.run_number }}
          path: "*.zip"
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display downloaded files
        run: |
          ls -R release-artifacts/

      - name: Create GitHub Release (on tag push)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
          name: "AutoCut Matrix AI ${{ github.ref_name }} (macOS)"
          body: |
            ## AutoCut Matrix AI - macOS 双版本发布

            本版本同时包含适用于 Apple Silicon (M芯片) 与 Intel 处理器的 macOS 可执行文件。

            ### 系统要求
            - **M 芯片版本 (arm64)**: 适用于 Apple M1 / M2 / M3 / M4 等芯片的 Mac，支持 Metal GPU 硬件加速。
            - **Intel 版本 (x86_64)**: 适用于使用 Intel 芯片的旧款 Mac。

            ### 安装步骤
            1. 下载对应架构的 `.zip` 压缩包并解压。
            2. 将 Whisper 模型放入 `models/whisper-cpp/` 目录：
               - 推荐：`ggml-small.bin` (487 MB)
               - 下载链接：https://huggingface.co/ggerganov/whisper.cpp/tree/main
            3. 打开终端或双击运行解压后的 `AutoCut_Mac_*` 目录中的主程序。
            4. 在浏览器中访问 `http://127.0.0.1:5000`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
